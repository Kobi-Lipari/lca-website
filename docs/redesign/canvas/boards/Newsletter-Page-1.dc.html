<h3>A note from the president</h3>
<p>Dear members,</p>
<p>Thank you to every volunteer who ran the State Championship weekend in Sulphur.</p>
<p>The new year starts busy: the Ken Ferguson Memorial in January, a youth meet every month to May.</p>
<p>One ask: please <a href="#">renew your membership</a>, and bring one new player to a club night.</p>
<p>See you over the board,<br>LCA President</p>
<h3>Coming up</h3>
<p>Sat, Dec 5, 2026 · New Orleans Youth Chess December Meet · New Orleans&nbsp;· <a href="#">Register&nbsp;on&nbsp;King&nbsp;Registration&nbsp;↗</a></p>
<p>Sat to Mon, Jan 16 to 18, 2027 · Ken Ferguson Memorial · New Orleans · run by Downriver Chess&nbsp;· <a href="#">Registers&nbsp;on&nbsp;the&nbsp;organizer's&nbsp;site&nbsp;↗</a></p>
<p>Sat, May 8, 2027 · New Orleans Youth Chess Grand Prix Final · New Orleans&nbsp;· <a href="#">Details&nbsp;on&nbsp;King&nbsp;Registration&nbsp;↗</a><span class="p1-caret" aria-hidden="true"></span></p>
<h3>Results</h3>
<p><b>Marcus Landry wins the 2026 Louisiana State Championship</b> with 4½ of 5 in Sulphur, Sat to Mon, Sep 5 to 7, 2026, among 64 players.</p>
