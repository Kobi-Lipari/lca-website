<h3>A note from the president</h3>
<p>Dear members,</p>
<p>Thank you to every volunteer who ran the State Championship weekend in Sulphur.</p>
<p>The new year starts busy: the Ken Ferguson Memorial in January, a youth meet every month to May.</p>
<p>One ask: please <a href="#">renew your membership</a>, and bring one new player to a club night.</p>
<p>See you over the board,<br>LCA President</p>
<h3>Coming up</h3>
<p>Sat, Dec 5, 2026 · New Orleans Youth Chess December Meet · New Orleans · <a href="#">Register on King Registration ↗</a></p>
<p>Sat to Mon, Jan 16 to 18, 2027 · Ken Ferguson Memorial · New Orleans · run by Downriver Chess · <a href="#">Registers on the organizer's site ↗</a></p>
<p>Sat, May 8, 2027 · New Orleans Youth Chess Grand Prix Final · New Orleans · <a href="#">Details on King Registration ↗</a></p>
<h3>Results</h3>
<p><b>Marcus Landry wins the 2026 Louisiana State Championship</b> with 4½ of 5 in Sulphur, Sat to Mon, Sep 5 to 7, 2026, among 64 players. Section winners: Open Marcus Landry 4½ · U1800 Devin Batiste 4½ · U1400 Sam Nguyen and Leo Robichaux 4, tied · U1000 Theo Guidry 4½. <a href="#">Full results ↗</a></p>
<h3>From the clubs</h3>
<p>Picayune Chess Club: quick-rated nights on first Mondays, next Mon, Dec 7, 2026 at 6:00 PM. <a href="#">Club page</a></p>
<p>Bunkie Chess Club: Tuesdays, 4:00 PM to 6:00 PM, Bunkie Library. Ages 8 to 108, free to join. <a href="#">Club page</a></p>
<p>Baton Rouge Chess Club: casual nights on Wednesdays at Boba ParTea. <a href="#">Club page</a></p>
<h3>Scholastic</h3>
<p>For parents: the New Orleans Youth Chess season began Sat, Nov 14, 2026, one Saturday a month to May.<br>Players need a US Chess membership. <a href="#">Scholastic page</a></p>
<h3>Board business</h3>
<p class="p3-starter" style="margin-bottom:0"><span class="p3-caret" aria-hidden="true"></span>Write here, or delete this heading.</p>

<p>Dear members,</p>
<p>Thank you to every volunteer who ran the State Championship weekend in Sulphur.</p>
<p>The new year starts busy: the Ken Ferguson Memorial in January, a youth meet every month to May.</p>
