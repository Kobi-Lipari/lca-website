<style>
body{margin:0;background:#ecebe6;font-family:Geist,system-ui,sans-serif;color:#1a2744}
.pl-root{width:1440px;margin:0 auto;box-sizing:border-box;padding:36px 72px 48px;background:#ecebe6;color:#1a2744;font-family:Geist,system-ui,sans-serif}
.pl-root *{box-sizing:border-box}

/* label strip */
.pl-strip{display:flex;align-items:center;justify-content:space-between;gap:32px;padding:24px 30px 26px;background:#ffffff;border:1px solid #dddcd4;border-radius:16px}
.pl-strip h1{margin:8px 0 0;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.015em;color:#1a2744}
.pl-strip p.pl-say{margin:8px 0 0;font-size:18px;line-height:1.5;color:#3d4556}
.pl-strip .k-sample{flex:none}

/* layout */
.pl-grid{display:grid;grid-template-columns:780px 390px;justify-content:space-between;align-items:start;margin-top:36px}
.pl-col{display:flex;flex-direction:column;gap:48px}
.pl-fig{margin:0}
.pl-cap{margin:14px 0 0;font-size:14px;line-height:1.4;color:#555c6b}

/* mail window */
.pm-win{background:#ffffff;border:1px solid #cfcec6;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(16,24,43,.12)}
.pm-top{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;background:#eeede8;border-bottom:1px solid #d9d8d1}
.pm-top i{display:block;width:12px;height:12px;border-radius:50%;background:#cfcdc4}
.pm-top span{flex:1;text-align:center;margin-right:52px;font-size:13px;font-weight:600;color:#3d4556}
.pm-tools{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px;border-bottom:1px solid #ecebe4;font-size:13.5px;font-weight:600;color:#3d4556}
.pm-tools span{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px}
.pm-tools .pm-gap{flex:1;padding:0}
.pm-tools svg{width:15px;height:15px;fill:none;stroke:#3d4556;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pm-head{padding:20px 28px 18px;border-bottom:1px solid #ecebe4}
.pm-head h2{margin:0;font-size:22px;line-height:1.25;font-weight:600;color:#1a2744}
.pm-who{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:14px}
.pm-av{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:#1a2744}
.pm-av svg{width:23px;height:23px;fill:#ffffff}
.pm-who b{display:block;font-size:15px;line-height:1.3;color:#1a2744}
.pm-who small{display:block;font-size:13px;line-height:1.35;color:#555c6b}
.pm-when{font-size:13px;color:#3d4556;text-align:right}
.pm-body{background:#ffffff;padding:8px 0 24px}

/* the email: the plain letter */
.pe{width:600px;margin:0 auto;background:#ffffff;padding:32px 44px 36px;font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:17px;line-height:1.6;color:#1f2a40}
.pe-mast{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid #c8a94a}
.pe-mast svg{width:28px;height:28px;fill:#1a2744;flex:none}
.pe-mast b{display:block;font-family:Geist,Arial,sans-serif;font-size:18px;line-height:1.2;font-weight:700;color:#1a2744;letter-spacing:-.005em}
.pe-mast span{display:block;font-family:Geist,Arial,sans-serif;font-size:14px;line-height:1.35;color:#555c6b;margin-top:2px}
.pe-letter{padding-top:26px}
.pe h3{margin:32px 0 8px;font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.3;font-weight:700;color:#1a2744}
.pe h3:first-child{margin-top:0}
.pe p{margin:0 0 12px}
.pe p.pe-l{margin:0 0 10px}
.pe p.pe-end{margin-bottom:0}
.pe b{font-weight:700;color:#1a2744}
.pe em{font-style:italic}
.pe a{color:#1a2744;white-space:nowrap;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.pe-foot{margin-top:36px;padding-top:18px;border-top:1px solid #dcdad2;font-size:14px;line-height:1.55;color:#555c6b}
.pe-foot p{margin:0 0 8px}
.pe-foot p:last-child{margin:0}
.pe-foot a{color:#555c6b}
.pe-nw{white-space:nowrap}
.pe-links{display:flex;flex-direction:column;align-items:flex-start;gap:4px}

/* phones */
.pp-sb{display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 28px;font-size:15px;font-weight:600;color:#1a2744;flex:none}
.pp-sbi{display:flex;gap:6px;align-items:center}
.pp-sbi i{display:block;width:16px;height:10px;border-radius:2px;background:currentColor}
.pp-sbi i+i{width:23px;height:11px;border-radius:3px;border:1.5px solid currentColor;background:transparent}
.pp-nav{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 16px;font-size:16px;color:#2d5fb5;flex:none}
.pp-mh{padding:4px 20px 14px;border-bottom:1px solid #ecebe4;flex:none}
.pp-mh h2{margin:0;font-size:20px;line-height:1.25;font-weight:600;color:#1a2744}
.pp-nav span{display:inline-flex;align-items:center;gap:4px}
.pp-mh .pm-who{grid-template-columns:36px minmax(0,1fr);gap:10px;margin-top:12px}
.pp-mh .pm-av{width:36px;height:36px}
.pp-mh .pm-av svg{width:20px;height:20px}
.pp-scroll{position:relative}
.pp-em{padding:22px 22px 0;font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.6;color:#1f2a40}
.pp-em .pe-mast{padding-bottom:14px}
.pp-em .pe-mast svg{width:24px;height:24px}
.pp-em .pe-mast b{font-size:16px}
.pp-em .pe-mast span{font-size:13px}
.pp-em .pe-letter{padding-top:20px}
.pp-em h3{margin:26px 0 6px;font-family:"Source Serif 4",Georgia,serif;font-size:18px;line-height:1.3;font-weight:700;color:#1a2744}
.pp-em h3:first-child{margin-top:0}
.pp-em p{margin:0 0 11px}
.pp-em p.pe-l{margin:0 0 9px}
.pp-em p.pe-end{margin-bottom:0}
.pp-em a{color:#1a2744;white-space:nowrap;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.pp-em .pe-foot{margin-top:28px;padding-top:16px;font-size:14px}
.pp-em .pe-links{flex-direction:column;gap:6px}
.pp-bot{display:flex;justify-content:space-around;align-items:center;height:52px;border-top:1px solid #ecebe4;background:#ffffff;color:#2d5fb5;flex:none}
.pp-safe{flex:none;height:26px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;background:#ffffff}
.pp-safe i{display:block;width:124px;height:5px;border-radius:3px;background:#10182b}
.pp-fade{position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(rgba(255,255,255,0),#ffffff)}

/* dark setting */
.pp-dark{background:#151719}
.pp-dark .pp-sb{color:#ffffff}
.pp-dark .pp-nav{color:#8fb0f0;background:#151719;border-bottom:1px solid #2b2e33;position:relative;z-index:2}
.pp-dark .pp-bot{color:#8fb0f0;background:#151719;border-top-color:#2b2e33}

.pp-dark .pp-em{color:#e4e5e8}

.pp-dark .pp-em a{color:#c9d7f5}
.pp-dark .pe-foot{color:#a9adb6;border-top-color:#3a3d43}
.pp-dark .pe-foot a{color:#c4c8d0}
.pp-end{position:absolute;left:0;right:0;top:0;padding-top:30px}

<div class="pe-letter">
<h3>A note from the president</h3>
<p>Dear members,</p>
<p>Thank you to every volunteer who ran the State Championship weekend in Sulphur.</p>
<p>The new year starts busy: the Ken Ferguson Memorial in January, a youth meet every month to May.</p>
<p>One ask: please <a href="#">renew your membership</a>, and bring one new player to a club night.</p>
<p class="pe-end">See you over the board,<br><em>LCA President</em></p>
<h3>Coming up</h3>
<p class="pe-l"><span class="pe-nw">Sat, Dec 5, 2026</span> · New Orleans Youth Chess December Meet · New Orleans · <a href="#">Register on King Registration ↗</a></p>
<p class="pe-l"><span class="pe-nw">Sat to Mon, Jan 16 to 18, 2027</span> · Ken Ferguson Memorial · New Orleans · run by Downriver Chess · <a href="#">Registers on the organizer's site ↗</a></p>
<p class="pe-l pe-end"><span class="pe-nw">Sat, May 8, 2027</span> · New Orleans Youth Chess Grand Prix Final · New Orleans · <a href="#">Details on King Registration ↗</a></p>
<h3>Results</h3>
<p class="pe-end"><b>Marcus Landry wins the 2026 Louisiana State Championship</b> with 4½ of 5 in Sulphur, <span class="pe-nw">Sat to Mon, Sep 5 to 7, 2026</span>, among 64 players. Section winners: Open Marcus Landry 4½ · U1800 Devin Batiste 4½ · U1400 Sam Nguyen and Leo Robichaux 4, tied · U1000 Theo Guidry 4½. <a href="#">Full results ↗</a></p>
<h3>From the clubs</h3>
<p class="pe-l">Picayune Chess Club: quick-rated nights on first Mondays, next <span class="pe-nw">Mon, Dec 7, 2026</span> at 6:00 PM. <a href="#">Club page</a></p>
<p class="pe-l">Bunkie Chess Club: Tuesdays, 4:00 PM to 6:00 PM, Bunkie Library. Ages 8 to 108, free to join. <a href="#">Club page</a></p>
<p class="pe-l pe-end">Baton Rouge Chess Club: casual nights on Wednesdays at Boba ParTea. <a href="#">Club page</a></p>
<h3>Scholastic</h3>
<p class="pe-end">For parents: the New Orleans Youth Chess season began <span class="pe-nw">Sat, Nov 14, 2026</span>, one Saturday a month to May.<br>Players need a US Chess membership. <a href="#">Scholastic page</a></p>
<h3>Board business</h3>
<p class="pe-end">Two regional representative seats are open, Central Louisiana and Southwest Louisiana; reply to this email if you would like to help. Draft minutes of the annual meeting of <span class="pe-nw">Sun, Sep 6, 2026</span> are posted for members' comments. <a href="#">Read the draft minutes</a></p>
</div>
