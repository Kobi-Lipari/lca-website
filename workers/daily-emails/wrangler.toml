# workers/daily-emails/wrangler.toml
#
# Despite the name this is the site scheduled-jobs Worker: it runs the daily
# tournament emails and the five-minute campaign sweep. The name is kept
# because renaming a Worker deploys a new one and leaves the old one running
# its cron — which for this Worker would mean every daily email going out
# twice until someone noticed and deleted it. Not worth the tidiness.
name = "lca-daily-emails"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Two schedules, dispatched on controller.cron in src/index.ts:
#   0 12 * * *  daily emails. 12:00 UTC = 7:00 AM Central (CDT). Adjust if
#               the board wants a different send time; cron is always UTC.
#   */5 * * * * campaign sweep. Bounds how long a mass email can sit half-sent
#               after the request that started it was cut off. Cheap when
#               there is nothing in flight: one indexed count and out.
[triggers]
crons = ["0 12 * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lca-db"
database_id = "e891b93f-e7fe-48d0-9afc-8570d805ef08"

# Links in reminder emails are built from this. Keep it in step with the
# SITE_URL in the root wrangler.toml — this Worker has no request to derive
# an origin from, so an unset value falls back to the default in utils/site.
[vars]
SITE_URL = "https://www.louisianachess.org"

# FROM_EMAIL is optional (transport falls back to noreply@louisianachess.org).
# FROM_EMAIL = "noreply@louisianachess.org"

# Secrets (set once, from repo root):
#   npx wrangler secret put RESEND_API_KEY --config workers/daily-emails/wrangler.toml
# Note: plain `wrangler secret put`, NOT `wrangler pages secret put` — this is
# a standalone Worker, not a Pages project.