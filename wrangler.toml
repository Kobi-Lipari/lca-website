name = "lca-website"
compatibility_date = "2024-08-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "lca-db"
database_id = "e891b93f-e7fe-48d0-9afc-8570d805ef08"

[vars]
# Canonical public origin. Every link in outgoing mail is built from this, so
# moving the site is this line plus the matching one in the Worker config —
# not a search for hardcoded hostnames. Must match the Supabase Site URL, or
# auth emails and app emails will disagree about where the site lives.
#
# The www form, not the apex: a Cloudflare redirect rule sends
# louisianachess.org/* to www permanently, so the apex never serves content.
# Pointing mail at the apex worked, but every link took a redirect hop, and
# Supabase returns its tokens in the URL fragment — which survives a redirect
# by browser convention rather than by anything guaranteed.
SITE_URL = "https://www.louisianachess.org"
SUPABASE_URL = "https://pijwjyzlzaysjwvfpcqt.supabase.co"
FROM_EMAIL = "noreply@louisianachess.org"
CONTACT_EMAIL = "louisianachess@gmail.com"
SUPPORT_EMAIL = "louisianachess@gmail.com"
REPLY_TO_EMAIL = "louisianachess@gmail.com"
VITE_SITE_URL = "https://www.louisianachess.org"  # build-time twin of SITE_URL, for the email preview
VITE_SUPABASE_URL = "https://pijwjyzlzaysjwvfpcqt.supabase.co"
VITE_SUPABASE_ANON_KEY = "sb_publishable_f19vYEFtISf2_oBdOWSHLA_h3AY2sT3"
VITE_GOOGLE_MAPS_API_KEY = "AIzaSyA0sTvidf63X8gWIqYn-NVklp-phgceW1g"
# SUPABASE_SERVICE_ROLE_KEY is a secret - managed via Cloudflare dashboard only

[[r2_buckets]]
binding = "CLUB_LOGOS"
bucket_name = "lca-club-logos"

# ---------------------------------------------------------------------------
# Preview deployments (every branch except main)
#
# Branch previews get their own database. K created lca-db-preview on
# October 8, 2026 (region ENAM). Previews must never bind lca-db: a preview
# bound to production writes real registrations, payments and accounts.
# The binding name stays DB so the same code reads env.DB in both places.
#
# Pages does not carry vars, d1_databases or r2_buckets over from the top
# level into an environment, so everything below repeats the production
# values on purpose. Keep the two lists in step; test/unit/wrangler-config.test.ts
# fails if a key is missing here. SITE_URL stays the production origin, so a
# link in any mail sent from a preview points at the live site.
#
# Migrate it with `npm run db:migrate:preview`, which runs
# scripts/db/preview-guard.ts first. Secrets for previews (Stripe test keys;
# no Resend key until test mail is wanted) are set separately in the Pages
# dashboard under the Preview environment.
# ---------------------------------------------------------------------------
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "lca-db-preview"
database_id = "28e13174-3a06-47a7-ab0f-b4ac7f24af6f"

[env.preview.vars]
SITE_URL = "https://www.louisianachess.org"
SUPABASE_URL = "https://pijwjyzlzaysjwvfpcqt.supabase.co"
FROM_EMAIL = "noreply@louisianachess.org"
CONTACT_EMAIL = "louisianachess@gmail.com"
SUPPORT_EMAIL = "louisianachess@gmail.com"
REPLY_TO_EMAIL = "louisianachess@gmail.com"
VITE_SITE_URL = "https://www.louisianachess.org"
VITE_SUPABASE_URL = "https://pijwjyzlzaysjwvfpcqt.supabase.co"
VITE_SUPABASE_ANON_KEY = "sb_publishable_f19vYEFtISf2_oBdOWSHLA_h3AY2sT3"
VITE_GOOGLE_MAPS_API_KEY = "AIzaSyA0sTvidf63X8gWIqYn-NVklp-phgceW1g"

# Still the production bucket: a logo uploaded on a preview shows on the
# live site. A separate preview bucket is a follow-up.
[[env.preview.r2_buckets]]
binding = "CLUB_LOGOS"
bucket_name = "lca-club-logos"
