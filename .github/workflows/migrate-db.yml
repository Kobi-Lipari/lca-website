name: Apply database migrations

# Applies any new files in migrations/ to the production D1 database
# (lca-db) whenever they land on main, so merging a PR is the whole
# release step — no more running `npm run db:migrate:remote` by hand.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN (the same token used
# for wrangler in a Codespace, with D1 edit access). Add it under
# Settings → Secrets and variables → Actions. CLOUDFLARE_ACCOUNT_ID is
# optional; wrangler finds the account on its own when the token only
# covers one.
#
# Wrangler records which migrations have run, so this is safe to run
# repeatedly: already-applied files are skipped. It can also be started by
# hand from the Actions tab ("Run workflow").
#
# Cloudflare Pages deploys the site from the same push in parallel. The
# migration takes seconds and the site build takes minutes, so the new
# tables exist before the new code goes live. Migrations should still only
# ever ADD things (tables, columns) so old code keeps working either way.

on:
  push:
    branches: [main]
    paths: ['migrations/**']
  workflow_dispatch:

# Never two migration runs at once.
concurrency:
  group: migrate-db
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list lca-db --remote

      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler asks for confirmation when it thinks it's interactive.
          CI: 'true'
        run: npx wrangler d1 migrations apply lca-db --remote
