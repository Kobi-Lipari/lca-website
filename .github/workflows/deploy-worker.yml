name: Deploy scheduled-jobs worker

# Deploys workers/daily-emails (reminder emails, the group-email sweep,
# membership expiry, rating snapshots) whenever it or the shared code it
# imports from functions/utils or domain changes on main. Cloudflare Pages
# deploys the site on its own, but this Worker is separate and used to need a
# manual `wrangler deploy`, so its emails could fall behind the site's.
#
# Uses the same CLOUDFLARE_API_TOKEN secret as the migration workflow. The
# token needs "Workers Scripts: Edit" on the account; if this job fails with
# an authentication error, add that permission to the token in the
# Cloudflare dashboard and re-run.

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'functions/utils/**'
      - 'domain/**'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy lca-daily-emails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/daily-emails/wrangler.toml
